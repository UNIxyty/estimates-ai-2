<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:100%;font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);">
  <sc-if value="{{ pickerOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:0;right:0;bottom:calc(100% + 8px);z-index:30;max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(16,24,40,0.16);overflow:hidden;display:flex;flex-direction:column;">
      <div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line2);">
        <span style="font-family:'IBM Plex Mono',monospace;color:var(--accInk);font-weight:600;">/</span>
        <input ref="{{ searchRef }}" value="{{ query }}" onChange="{{ onQuery }}" onKeyDown="{{ onKey }}" placeholder="Search reference files" style="flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:13.5px;"></input>
        <span style="font-size:11.5px;color:var(--ink3);white-space:nowrap;">{{ selCount }}</span>
      </div>
      <div style="max-height:300px;overflow:auto;padding:4px 0;">
        <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
          <div style="padding:8px 14px 4px;font-size:11.5px;font-weight:500;color:var(--ink3);">{{ g.label }}</div>
          <sc-for list="{{ g.items }}" as="f" hint-placeholder-count="2">
            <div onClick="{{ f.toggle }}" onMouseEnter="{{ f.hover }}" style="display:flex;align-items:center;gap:10px;height:36px;padding:0 14px;background:{{ f.bg }};cursor:{{ f.cursor }};opacity:{{ f.op }};">
              <span style="width:16px;height:16px;flex:none;border-radius:4px;border:1.5px solid {{ f.boxLine }};background:{{ f.boxBg }};color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;">{{ f.check }}</span>
              <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;">{{ f.name }}</span>
              <span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:{{ f.sfg }};white-space:nowrap;"><span style="width:6px;height:6px;border-radius:50%;background:currentColor;"></span>{{ f.status }}</span>
              <span style="flex:none;display:inline-flex;align-items:center;height:17px;padding:0 5px;border:1px solid var(--line);border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;color:var(--ink2);">{{ f.lang }}</span>
            </div>
          </sc-for>
        </sc-for>
        <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}"><div style="padding:16px 14px;color:var(--ink3);font-size:13px;">No files match “{{ query }}”.</div></sc-if>
      </div>
      <div style="display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line2);background:var(--side);font-size:11.5px;color:var(--ink3);">
        <span><b style="font-family:'IBM Plex Mono',monospace;font-weight:500;color:var(--ink2);">↑↓</b> move</span><span><b style="font-family:'IBM Plex Mono',monospace;font-weight:500;color:var(--ink2);">Enter</b> select</span><span><b style="font-family:'IBM Plex Mono',monospace;font-weight:500;color:var(--ink2);">Esc</b> close</span>
        <button onClick="{{ closePicker }}" style="margin-left:auto;border:0;background:transparent;color:var(--accInk);font:inherit;font-weight:500;cursor:pointer;">Done</button>
      </div>
    </div>
  </sc-if>

  <div onDragOver="{{ onDragOver }}" onDragLeave="{{ onDragLeave }}" onDrop="{{ onDrop }}" style="border:1px solid {{ boxLine }};border-radius:18px;background:var(--panel);box-shadow:0 1px 2px rgba(16,24,40,0.04),0 6px 20px rgba(16,24,40,0.05);display:flex;flex-direction:column;opacity:{{ boxOp }};">
    <sc-if value="{{ hasChips }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px 0;">
        <sc-for list="{{ chips }}" as="c" hint-placeholder-count="2">
          <span style="display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:12.5px;max-width:260px;">
            <span style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;color:{{ c.kindFg }};">{{ c.kind }}</span>
            <button onClick="{{ c.open }}" style="border:0;padding:0;background:transparent;color:var(--ink);font:inherit;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;" style-hover="text-decoration:underline;">{{ c.name }}</button>
            <span style="font-size:11px;color:var(--ink3);white-space:nowrap;">{{ c.role }}</span>
            <button onClick="{{ c.remove }}" title="Remove" style="width:20px;height:20px;flex:none;border:0;border-radius:5px;background:transparent;color:var(--ink3);font-size:14px;line-height:1;cursor:pointer;" style-hover="background:var(--sunk);color:var(--ink);">×</button>
          </span>
        </sc-for>
      </div>
    </sc-if>
    <textarea ref="{{ taRef }}" value="{{ text }}" onChange="{{ onText }}" onKeyDown="{{ onTaKey }}" disabled="{{ disabled }}" rows="{{ rows }}" placeholder="{{ placeholder }}" style="border:0;outline:0;resize:none;background:transparent;color:var(--ink);font:inherit;font-size:15px;line-height:1.5;padding:14px 16px 6px;min-height:52px;"></textarea>
    <div style="display:flex;align-items:center;gap:6px;padding:6px 10px 10px;">
      <label title="Attach files" style="width:34px;height:34px;flex:none;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:18px;cursor:pointer;" style-hover="background:var(--sunk);">+<input type="file" multiple="{{ true }}" onChange="{{ onFiles }}" style="display:none;"></input></label>
      <button onClick="{{ openPicker }}" style="height:34px;padding:0 10px;border:0;border-radius:10px;background:transparent;color:var(--ink2);font:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;" style-hover="background:var(--sunk);"><span style="font-family:'IBM Plex Mono',monospace;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11.5px;">/</span>References</button>
      <div style="flex:1;"></div>
      <span style="font-size:12px;color:var(--ink3);white-space:nowrap;">{{ hint }}</span>
      <button onClick="{{ send }}" title="Send" style="width:34px;height:34px;flex:none;border:0;border-radius:10px;background:{{ sendBg }};color:#fff;font-size:17px;cursor:pointer;">↑</button>
    </div>
  </div>
  <sc-if value="{{ dragging }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;border:2px dashed var(--acc);border-radius:18px;background:var(--accSoft);display:flex;align-items:center;justify-content:center;color:var(--accInk);font-weight:600;pointer-events:none;">Drop files to attach</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:480},&quot;chips&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{name,doc,role}[]&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Auto model · about $0.02 per question&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;pickerOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;pickerQuery&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;focusKey&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;addChip&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;onSend&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(text, chips) =&gt; void&quot;},&quot;onOpenDoc&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(jump) =&gt; void&quot;}}">
const FILES = [
  ['Priced estimates (reference)', [['data-center.xlsx', 'datacenter', 'ok', 'DA'], ['Braila 23.xlsx', 'braila', 'ok', 'LV'], ['Skolegade 14.xlsx', null, 'ok', 'DA'], ['Priedes iela 4.xlsx', null, 'ok', 'LV']]],
  ['Hourly norms', [['norms.docx', 'norms', 'ok', 'EN'], ['Stundu normas 2024.pdf', null, 'ok', 'LV']]],
  ['Price lists', [['Price list 2025.xlsx', null, 'ok', 'LV'], ['Solar prisliste 2025.pdf', 'solar', 'ok', 'DA'], ['Supplier prices Q3.xlsx', null, 'run', 'EN']]],
  ['Other', [['Tilbud_scan_2019.pdf', 'broken', 'err', 'LV']]],
];
const ST = { ok: ['Analysed', 'var(--ok)'], run: ['Analysing', 'var(--acc)'], err: ['Failed', 'var(--err)'] };
const kindOf = n => { const e = n.split('.').pop().toLowerCase(); return e === 'pdf' ? ['PDF', 'var(--err)'] : e === 'docx' || e === 'doc' ? ['DOCX', 'var(--accInk)'] : ['XLSX', 'var(--ok)']; };
class Component extends DCLogic {
  state = { text: null, chips: null, open: false, q: '', idx: 0, drag: false, viaSlash: false };
  taRef = React.createRef(); searchRef = React.createRef();
  componentDidMount() { if (this.props.pickerOpen) this.setState({ open: true, q: this.props.pickerQuery || '' }); }
  componentDidUpdate(pp) {
    if (this.props.focusKey && pp.focusKey !== this.props.focusKey) {
      const add = this.props.addChip; if (add) { const cs = this.chips(); if (!cs.find(c => c.name === add.name)) this.setState({ chips: [...cs, add] }); }
      setTimeout(() => this.taRef.current && this.taRef.current.focus(), 30);
    }
  }
  chips() { return this.state.chips || this.props.chips || []; }
  text() { return this.state.text ?? this.props.value ?? ''; }
  flat() { const q = this.state.q.toLowerCase(); return FILES.map(([label, items]) => [label, items.filter(f => f[0].toLowerCase().includes(q))]).filter(g => g[1].length); }
  toggleFile(f) {
    if (f[2] === 'err') return;
    const cs = this.chips(), has = cs.find(c => c.name === f[0]);
    this.setState({ chips: has ? cs.filter(c => c.name !== f[0]) : [...cs, { name: f[0], doc: f[1], role: 'Reference' }] });
  }
  close() {
    let t = this.text(); if (this.state.viaSlash) t = t.replace(/(^|\s)\/[^\s]*$/, '$1');
    this.setState({ open: false, q: '', text: t, viaSlash: false }); setTimeout(() => this.taRef.current && this.taRef.current.focus(), 20);
  }
  renderVals() {
    const chips = this.chips(), sel = new Set(chips.map(c => c.name)), groups = this.flat();
    const flatItems = groups.flatMap(g => g[1]); const idx = Math.min(this.state.idx, Math.max(0, flatItems.length - 1));
    let k = 0;
    const text = this.text(), disabled = !!this.props.disabled, lines = text.split('\n').length;
    const canSend = !disabled && (text.trim() || chips.length);
    return {
      pickerOpen: this.state.open, query: this.state.q, selCount: `${chips.filter(c => c.role === 'Reference').length} selected`, noResults: !flatItems.length,
      searchRef: this.searchRef,
      onQuery: e => this.setState({ q: e.target.value, idx: 0 }),
      onKey: e => {
        if (e.key === 'ArrowDown') { e.preventDefault(); this.setState({ idx: (idx + 1) % Math.max(1, flatItems.length) }); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); this.setState({ idx: (idx - 1 + flatItems.length) % Math.max(1, flatItems.length) }); }
        else if (e.key === 'Enter') { e.preventDefault(); flatItems[idx] && this.toggleFile(flatItems[idx]); }
        else if (e.key === 'Escape') { e.preventDefault(); this.close(); }
      },
      groups: groups.map(([label, items]) => ({ label, items: items.map(f => { const i = k++, on = sel.has(f[0]), dis = f[2] === 'err'; return {
        name: f[0], lang: f[3], status: ST[f[2]][0], sfg: ST[f[2]][1], check: on ? '✓' : '', boxBg: on ? 'var(--acc)' : 'transparent', boxLine: on ? 'var(--acc)' : 'var(--ink3)',
        bg: i === idx ? 'var(--sunk)' : 'transparent', cursor: dis ? 'not-allowed' : 'pointer', op: dis ? 0.55 : 1,
        toggle: () => { this.setState({ idx: i }); this.toggleFile(f); }, hover: () => this.state.idx !== i && this.setState({ idx: i }) }; }) })),
      closePicker: () => this.close(),
      openPicker: () => { this.setState({ open: true, q: '', idx: 0, viaSlash: false }); setTimeout(() => this.searchRef.current && this.searchRef.current.focus(), 30); },
      hasChips: chips.length > 0,
      chips: chips.map(c => { const kd = kindOf(c.name); return { name: c.name, role: c.role || '', kind: kd[0], kindFg: kd[1],
        open: () => this.props.onOpenDoc && c.doc && this.props.onOpenDoc({ doc: c.doc }),
        remove: () => this.setState({ chips: chips.filter(x => x.name !== c.name) }) }; }),
      text, rows: Math.min(8, Math.max(1, lines)), disabled,
      placeholder: this.props.placeholder || 'Message the agent. Type / to add reference files.',
      taRef: this.taRef,
      onText: e => { const v = e.target.value; const m = v.match(/(^|\s)\/([^\s]*)$/); this.setState({ text: v, ...(m ? { open: true, q: m[2], viaSlash: true, idx: 0 } : this.state.viaSlash ? { open: false, viaSlash: false } : {}) }); },
      onTaKey: e => {
        if (this.state.open && this.state.viaSlash) { if (['ArrowDown', 'ArrowUp', 'Enter', 'Escape'].includes(e.key)) return this.renderValsKey(e, flatItems, idx); }
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.doSend(); }
      },
      send: () => this.doSend(),
      sendBg: canSend ? 'var(--acc)' : 'var(--line)',
      hint: this.props.hint ?? 'Auto model · about $0.02 per question',
      boxLine: this.state.drag ? 'var(--acc)' : 'var(--line)', boxOp: disabled ? 0.6 : 1, dragging: this.state.drag,
      onFiles: e => { const fs = [...e.target.files].map(f => ({ name: f.name, role: /\.xlsx?$/i.test(f.name) ? 'Blank' : 'Work list' })); this.setState({ chips: [...chips, ...fs] }); e.target.value = ''; },
      onDragOver: e => { e.preventDefault(); if (!this.state.drag) this.setState({ drag: true }); },
      onDragLeave: () => this.setState({ drag: false }),
      onDrop: e => { e.preventDefault(); const fs = [...(e.dataTransfer.files || [])].map(f => ({ name: f.name, role: /\.xlsx?$/i.test(f.name) ? 'Blank' : 'Work list' })); this.setState({ drag: false, chips: [...chips, ...fs] }); },
    };
  }
  renderValsKey(e, flatItems, idx) {
    e.preventDefault();
    if (e.key === 'ArrowDown') this.setState({ idx: (idx + 1) % Math.max(1, flatItems.length) });
    else if (e.key === 'ArrowUp') this.setState({ idx: (idx - 1 + flatItems.length) % Math.max(1, flatItems.length) });
    else if (e.key === 'Enter') flatItems[idx] && this.toggleFile(flatItems[idx]);
    else if (e.key === 'Escape') this.close();
  }
  doSend() {
    const text = this.text().trim(), chips = this.chips();
    if (this.props.disabled || (!text && !chips.length)) return;
    this.props.onSend && this.props.onSend(text, chips);
    this.setState({ text: '', chips: [], open: false });
  }
}
</script>
</body>
</html>
