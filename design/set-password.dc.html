<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('eaa-theme')||'light'}catch(e){}</script>
<style>
:root,[data-theme=light]{--bg:#fcfcfd;--side:#f5f6f8;--panel:#ffffff;--sunk:#eef0f3;--bubble:#eceff4;--line:#e1e4e9;--line2:#eceef2;--ink:#15181c;--ink2:#4a525c;--ink3:#737b86;--acc:#1f5eff;--accSoft:#e7eeff;--accInk:#1747c9;--ok:#177a43;--okSoft:#e3f3e9;--warn:#9a5700;--warnSoft:#fcefd8;--err:#bf3228;--errSoft:#fbe6e4;--web:#0d6e84;--webSoft:#dff1f5;--hl:#fff1b3;--hl2:#fff8d6;color-scheme:light}
[data-theme=dark]{--bg:#141619;--side:#101214;--panel:#1a1d21;--sunk:#23272c;--bubble:#262a30;--line:#2d3238;--line2:#23272c;--ink:#e7e9ec;--ink2:#adb4bc;--ink3:#7f8791;--acc:#4a7dff;--accSoft:#1b2851;--accInk:#9ab7ff;--ok:#5cc98a;--okSoft:#14301f;--warn:#f0b04a;--warnSoft:#3a2a10;--err:#f07a70;--errSoft:#3d1a18;--web:#55c6da;--webSoft:#0f2d33;--hl:#4a3f12;--hl2:#2e2912;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:var(--accInk)}a:hover{color:var(--acc)}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<title>Set password · Estimates AI Agent</title></helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px 20px;background:var(--bg);color:var(--ink);">
  <div style="display:flex;align-items:center;gap:10px;">
    <span style="width:30px;height:30px;border-radius:8px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;">E</span>
    <span style="font-weight:600;font-size:17px;letter-spacing:-0.01em;">Estimates AI Agent</span>
  </div>
  <div style="width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px;padding:28px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:0 1px 2px rgba(16,24,40,0.04),0 12px 32px rgba(16,24,40,0.06);">
    <sc-if value="{{ expired }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start;">
        <span style="width:36px;height:36px;border-radius:50%;background:var(--warnSoft);color:var(--warn);display:flex;align-items:center;justify-content:center;font-weight:700;">!</span>
        <h1 style="margin:0;font-size:22px;font-weight:600;">This link has expired</h1>
        <div style="font-size:14px;color:var(--ink2);line-height:1.55;">Invite and reset links work for 7 days and 1 hour. Ask your administrator for a new invite, or request a new reset link.</div>
        <a href="login.dc.html" style="font-size:14px;font-weight:500;">Go to sign in</a>
      </div>
    </sc-if>
    <sc-if value="{{ valid }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;gap:6px;">
        <h1 style="margin:0;font-size:22px;font-weight:600;letter-spacing:-0.01em;">{{ heading }}</h1>
        <div style="font-size:14px;color:var(--ink2);line-height:1.5;">{{ sub }}</div>
      </div>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:500;">Email<input value="m.kalnins@elektro.lv" disabled="{{ true }}" style="height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--ink2);font:inherit;font-weight:400;font-size:15px;"></input></label>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:500;">New password<input type="password" value="{{ pw }}" onChange="{{ onPw }}" style="height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-weight:400;font-size:15px;outline-color:var(--acc);"></input></label>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:500;">Repeat password<input type="password" value="{{ pw2 }}" onChange="{{ onPw2 }}" style="height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-weight:400;font-size:15px;outline-color:var(--acc);"></input></label>
      <div style="display:flex;flex-direction:column;gap:6px;font-size:13.5px;">
        <sc-for list="{{ rules }}" as="r" hint-placeholder-count="3"><span style="display:flex;align-items:center;gap:8px;color:{{ r.fg }};"><span style="width:16px;height:16px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:9px;background:{{ r.bg }};color:{{ r.tick }};">✓</span>{{ r.label }}</span></sc-for>
      </div>
      <a href="{{ next }}" style="height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:{{ btnBg }};color:#fff;text-decoration:none;font-size:15px;font-weight:600;pointer-events:{{ btnPe }};">{{ cta }}</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { pw: '', pw2: '', reset: false, expired: false };
  componentDidMount() { const q = new URLSearchParams(location.search); this.setState({ reset: q.has('reset'), expired: q.has('expired') }); }
  renderVals() {
    const { pw, pw2, reset } = this.state;
    const rules = [['At least 10 characters', pw.length >= 10], ['Contains a number', /\d/.test(pw)], ['Both passwords match', pw && pw === pw2]];
    const ok = rules.every(r => r[1]);
    return {
      expired: this.state.expired, valid: !this.state.expired,
      heading: reset ? 'Choose a new password' : 'Welcome to Estimates AI Agent',
      sub: reset ? 'Your old password stops working once you save the new one.' : 'Anna Bērziņa invited you to Elektro Serviss SIA. Set a password to finish creating your account.',
      pw, pw2, onPw: e => this.setState({ pw: e.target.value }), onPw2: e => this.setState({ pw2: e.target.value }),
      rules: rules.map(([label, v]) => ({ label, fg: v ? 'var(--ok)' : 'var(--ink3)', bg: v ? 'var(--ok)' : 'transparent', tick: v ? '#fff' : 'transparent' })),
      cta: reset ? 'Save and sign in' : 'Set password and continue', next: reset ? 'login.dc.html' : 'setup.dc.html?empty=1',
      btnBg: ok ? 'var(--acc)' : 'var(--ink3)', btnPe: ok ? 'auto' : 'none',
    };
  }
}
</script>
</body>
</html>
