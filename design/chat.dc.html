<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Chat · Estimates AI Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('eaa-theme')||'light'}catch(e){}</script>
<style>

[data-theme=dark]{--bg:#141619;--side:#101214;--panel:#1a1d21;--sunk:#23272c;--bubble:#262a30;--line:#2d3238;--line2:#23272c;--ink:#e7e9ec;--ink2:#adb4bc;--ink3:#7f8791;--acc:#4a7dff;--accSoft:#1b2851;--accInk:#9ab7ff;--ok:#5cc98a;--okSoft:#14301f;--warn:#f0b04a;--warnSoft:#3a2a10;--err:#f07a70;--errSoft:#3d1a18;--web:#55c6da;--webSoft:#0f2d33;--hl:#4a3f12;--hl2:#2e2912;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:var(--accInk)}a:hover{color:var(--acc)}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div style="height:100vh;display:flex;background:var(--bg);color:var(--ink);overflow:hidden;user-select:{{ userSelect }};">
  <sc-if value="{{ showSidebar }}" hint-placeholder-val="{{ true }}">
    <dc-import name="Sidebar" active="chat" collapsed="{{ sideCollapsed }}" current="{{ scen }}" mobile="{{ mobile }}" open="{{ drawer }}" on-close="{{ closeDrawer }}" hint-size="264px,100%"></dc-import>
  </sc-if>
  <div ref="{{ rowRef }}" style="flex:1;min-width:0;display:flex;position:relative;">

    <sc-if value="{{ showRail }}" hint-placeholder-val="{{ false }}">
      <div style="width:64px;flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;border-right:1px solid var(--line);background:var(--side);">
        <span style="width:28px;height:28px;border-radius:7px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;">E</span>
        <button onClick="{{ exitFull }}" title="Back to split view" style="width:48px;padding:8px 0;border:0;border-radius:10px;background:transparent;color:var(--ink2);font:inherit;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;" style-hover="background:var(--sunk);"><span style="font-size:15px;">‹</span>Chat</button>
        <button onClick="{{ toggleFloat }}" title="Ask the agent" style="width:48px;padding:8px 0;border:0;border-radius:10px;background:{{ floatBg }};color:{{ floatFg }};font:inherit;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;"><span style="font-size:15px;">↑</span>Ask</button>
      </div>
    </sc-if>

    <sc-if value="{{ showConvo }}" hint-placeholder-val="{{ true }}">
      <main style="width:{{ convoW }};flex:{{ convoFlex }};min-width:0;display:flex;flex-direction:column;">
        <header style="height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px 0 {{ headPad }};">
          <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}"><button onClick="{{ openDrawer }}" title="Menu" style="width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--ink);font-size:18px;cursor:pointer;">☰</button></sc-if>
          <div style="min-width:0;display:flex;align-items:center;gap:8px;">
            <span style="font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ title }}</span>
            <span style="flex:none;display:inline-flex;align-items:center;height:17px;padding:0 5px;border:1px solid var(--line);border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;color:var(--ink2);">{{ lang }}</span>
          </div>
          <div style="flex:1;"></div>
          <sc-if value="{{ notMobile }}" hint-placeholder-val="{{ true }}"><span style="font-size:12px;color:var(--ink3);white-space:nowrap;">Conversation cost <span style="font-family:'IBM Plex Mono',monospace;">{{ convCost }}</span></span></sc-if>
        </header>
        <div ref="{{ scRef }}" style="flex:1;min-height:0;overflow:auto;">
          <div style="max-width:760px;margin:0 auto;padding:12px 20px 32px;display:flex;flex-direction:column;gap:28px;">
            <sc-for list="{{ msgs }}" as="m" hint-placeholder-count="3">
              <dc-import name="Message" style="width:100%;min-width:0;" msg="{{ m }}" on-open-doc="{{ openDoc }}" on-action="{{ onAction }}" hint-size="100%,80px"></dc-import>
            </sc-for>
          </div>
        </div>
        <div style="flex:none;padding:0 16px 16px;">
          <div style="max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px;">
            <sc-if value="{{ blocked }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--err);border-radius:12px;background:var(--errSoft);font-size:13.5px;">
                <span style="width:20px;height:20px;flex:none;border-radius:50%;background:var(--err);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;">!</span>
                <span style="flex:1;">Monthly AI budget reached ($300 of $300). New messages are paused until 1 October or until an admin raises the budget. You can still open and download estimates.</span>
                <a href="settings-usage.dc.html?b=over" style="flex:none;font-weight:600;">Budget settings</a>
              </div>
            </sc-if>
            <dc-import name="Composer" disabled="{{ blocked }}" focus-key="{{ focusKey }}" add-chip="{{ addChip }}" on-send="{{ onSend }}" on-open-doc="{{ openDoc }}" placeholder="{{ placeholder }}" hint-size="100%,112px"></dc-import>
          </div>
        </div>
      </main>
    </sc-if>

    <sc-if value="{{ showDivider }}" hint-placeholder-val="{{ false }}">
      <div onMouseDown="{{ startDrag }}" title="Drag to resize" style="width:9px;flex:none;margin:0 -4px;z-index:5;cursor:col-resize;display:flex;justify-content:center;" style-hover="background:var(--accSoft);">
        <div style="width:1px;height:100%;background:{{ dividerLine }};"></div>
      </div>
    </sc-if>

    <sc-if value="{{ showViewer }}" hint-placeholder-val="{{ false }}">
      <div style="flex:1;min-width:0;display:flex;position:{{ viewerPos }};inset:0;z-index:{{ viewerZ }};">
        <dc-import name="DocViewer" style="flex:1;min-width:0;width:100%;height:100%;display:flex;" docs="{{ vDocs }}" active="{{ vActive }}" jump="{{ vJump }}" mode="{{ vMode }}" on-close="{{ closeViewer }}" on-mode="{{ setMode }}" on-ask="{{ askDoc }}" hint-size="100%,100%"></dc-import>
        <sc-if value="{{ showFloat }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;left:24px;bottom:24px;width:min(640px,calc(100% - 48px));z-index:20;display:flex;flex-direction:column;gap:8px;">
            <sc-if value="{{ floatReply }}" hint-placeholder-val="{{ false }}">
              <div style="max-height:260px;overflow:auto;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:0 12px 40px rgba(16,24,40,0.18);">
                <dc-import name="Message" msg="{{ floatReply }}" on-open-doc="{{ openDoc }}" hint-size="100%,60px"></dc-import>
              </div>
            </sc-if>
            <div style="box-shadow:0 12px 40px rgba(16,24,40,0.18);border-radius:18px;">
              <dc-import name="Composer" focus-key="{{ focusKey }}" add-chip="{{ addChip }}" on-send="{{ onSend }}" on-open-doc="{{ openDoc }}" placeholder="Ask about this document" hint-size="100%,112px"></dc-import>
            </div>
          </div>
        </sc-if>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>

    if (m) return { role: 'agent', tier: 'Fast', cost: '$0.01', tokIn: 6100, tokOut: 150, blocks: [{ kind: 'text', paras: [[{ row: `EL · row ${m[1]}`, sheet: 'EL', n: +m[1] }, ' is priced from ', { file: 'data-center.xlsx', doc: 'datacenter' }, ' with the labour norm from ', { file: 'norms.docx', doc: 'norms' }, '. Open the row to see the matched reference row and confidence.']] }] };
    return { role: 'agent', tier: 'Fast', cost: '$0.01', tokIn: 4200, tokOut: 90, blocks: [{ kind: 'text', paras: [['Got it. Tell me which rows or sheet this applies to, or click a row in the estimate and ask about it.']] }] };
  }
  renderVals() {
    const st = this.state, sc = SC[st.scen] || SC.result, v = st.viewer, mobile = st.mobile;
    const mode = v ? (mobile ? 'sheet' : v.mode) : null, full = mode === 'full', split = mode === 'split';
    const msgs = st.msgs.map(m => m.live ? { ...m, blocks: m.blocks.map(b => b.live ? this.liveSteps() : b) } : m);
    return {
      scen: st.scen, mobile, notMobile: !mobile, drawer: st.drawer, openDrawer: () => this.setState({ drawer: true }), closeDrawer: () => this.setState({ drawer: false }),
      showSidebar: !full, sideCollapsed: split ? true : undefined, showRail: full, showConvo: !full && !(mobile && v), showDivider: split, showViewer: !!v,
      convoW: split ? `${st.split * 100}%` : 'auto', convoFlex: split ? 'none' : '1', headPad: mobile ? '6px' : '20px',
      viewerPos: mobile ? 'fixed' : 'relative', viewerZ: mobile ? 50 : 1, dividerLine: st.drag ? 'var(--acc)' : 'var(--line)', userSelect: st.drag ? 'none' : 'auto',
      title: sc.title, lang: sc.lang, convCost: sc.cost, blocked: !!sc.blocked,
      placeholder: v ? 'Ask about this document…' : 'Reply to the agent. Type / to add reference files.',
      msgs,
      rowRef: this._rowCb || (this._rowCb = el => { this._row = el; }),
      scRef: this._scCb || (this._scCb = el => { if (el && el !== this._sc) { this._sc = el; this._stick = Date.now() + 2500; const ro = new ResizeObserver(() => { if (Date.now() < this._stick) el.scrollTop = el.scrollHeight; }); if (el.firstElementChild) ro.observe(el.firstElementChild); } }),
      openDoc: j => { if (!j || !j.doc) return; const cur = this.state.viewer; const docs = cur ? (cur.docs.includes(j.doc) ? cur.docs : [...cur.docs, j.doc]) : [j.doc];
        this.setState({ viewer: { docs, active: j.doc, mode: cur ? cur.mode : 'split', jump: j.row ? { ...j, key: j.key || Date.now() } : (cur && cur.jump) } }); },
      closeViewer: () => this.setState({ viewer: null, float: false }),
      setMode: m => this.setState(s => ({ viewer: { ...s.viewer, mode: m }, float: false })),
      exitFull: () => this.setState(s => ({ viewer: { ...s.viewer, mode: 'split' }, float: false })),
      vDocs: v ? v.docs : [], vActive: v ? v.active : null, vJump: v ? v.jump : null, vMode: mode || 'split',
      startDrag: e => { e.preventDefault(); this.setState({ drag: true }); },
      askDoc: d => { const chip = { name: d.name, doc: d.id, role: 'Reference' }; if (this.state.viewer && this.state.viewer.mode === 'full' && !mobile) this.setState({ float: true }); if (mobile) this.setState({ viewer: null }); this.setState(s => ({ addChip: chip, focusKey: s.focusKey + 1 })); },
      showFloat: full && st.float, floatReply: st.floatReply, toggleFloat: () => this.setState(s => ({ float: !s.float })),
      floatBg: st.float ? 'var(--accSoft)' : 'transparent', floatFg: st.float ? 'var(--accInk)' : 'var(--ink2)',
      focusKey: st.focusKey, addChip: st.addChip,
      onSend: (text, chips) => {
        this.push({ role: 'user', text, chips });
        const r = this.reply(text || 'file');
        this.later(900, () => { if (full) this.setState({ floatReply: r }); this.push(r); });
      },
      onAction: (kind, a) => {
        if (kind === 'permission' && a === 'deny') this.later(500, () => this.push({ role: 'agent', tier: 'Standard', cost: '$0.05', tokIn: 21800, tokOut: 900, blocks: [{ kind: 'steps', status: 'done', title: 'Searched 3 supplier sites', elapsed: '38 s', items: [step('Searching suppliers for: 2-gang socket, IP44…', '3 found'), step('Priced 3 rows from the web', 'EL 42, 51, 52')] }, { kind: 'text', paras: [['Found prices for all 3 rows on lemu.dk and solar.dk. They are marked as web-sourced in the estimate so you can check them.']] }] }));
        if (kind === 'permission' && a === 'allow') this.later(500, () => this.push({ role: 'agent', tier: 'Standard', cost: '$0.03', tokIn: 14100, tokOut: 620, blocks: [{ kind: 'text', paras: [['Thanks. I used ', { b: 'Price list 2025.xlsx' }, ' for the 3 socket rows and finished pricing. All 206 rows are priced.']] }] }));
        if (kind === 'structure' && a === 'generate') this.later(500, () => this.push({ role: 'agent', tier: 'Advanced', cost: '$0.21', tokIn: 98200, tokOut: 14100, blocks: [{ kind: 'steps', status: 'done', title: 'Finished 5 steps', elapsed: '1 min 48 s', items: [step('Built sheets EL and ELT from Braila 23.xlsx', '4 sections'), step('Added 4 work items', '4 rows'), step('Priced labour', 'EUR 24/h'), step('Priced materials', '4 rows'), step('Checked totals', 'EUR 4,318.40')] }, { kind: 'text', paras: [['Done. Total ', { b: 'EUR 4,318.40' }, ' excl. VAT, in Latvian like Braila 23.']] }, { kind: 'doc', doc: 'braila24', name: 'Tāme_Braila_24.xlsx', lang: 'LV', meta: '2 sheets · generated just now' }] }));
        if (kind === 'structure' && a === 'change') this.later(400, () => this.push({ role: 'agent', tier: 'Fast', cost: '$0.00', tokIn: 900, tokOut: 40, blocks: [{ kind: 'text', paras: [['What should change? For example: add a sheet for low-voltage work, split cables by floor, or leave out labour.']] }] }));
        if (kind === 'clarify') this.later(500, () => this.push({ role: 'agent', tier: 'Advanced', cost: '$0.04', tokIn: 17800, tokOut: 700, blocks: [{ kind: 'text', paras: [['Thanks. That’s enough to start. I’ll propose a structure next.']] }, { kind: 'card', card: 'structure', state: 'pending' }] }));
        if (kind === 'steps' && a === 'stop') { clearInterval(this._iv); }
      },
    };
  }
}
