<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('eaa-theme')||'light'}catch(e){}</script>
<style>
:root,[data-theme=light]{--bg:#fcfcfd;--side:#f5f6f8;--panel:#ffffff;--sunk:#eef0f3;--bubble:#eceff4;--line:#e1e4e9;--line2:#eceef2;--ink:#15181c;--ink2:#4a525c;--ink3:#737b86;--acc:#1f5eff;--accSoft:#e7eeff;--accInk:#1747c9;--ok:#177a43;--okSoft:#e3f3e9;--warn:#9a5700;--warnSoft:#fcefd8;--err:#bf3228;--errSoft:#fbe6e4;--web:#0d6e84;--webSoft:#dff1f5;--hl:#fff1b3;--hl2:#fff8d6;color-scheme:light}
[data-theme=dark]{--bg:#141619;--side:#101214;--panel:#1a1d21;--sunk:#23272c;--bubble:#262a30;--line:#2d3238;--line2:#23272c;--ink:#e7e9ec;--ink2:#adb4bc;--ink3:#7f8791;--acc:#4a7dff;--accSoft:#1b2851;--accInk:#9ab7ff;--ok:#5cc98a;--okSoft:#14301f;--warn:#f0b04a;--warnSoft:#3a2a10;--err:#f07a70;--errSoft:#3d1a18;--web:#55c6da;--webSoft:#0f2d33;--hl:#4a3f12;--hl2:#2e2912;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:var(--accInk)}a:hover{color:var(--acc)}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<title>Phone views · Estimates AI Agent</title></helmet>
<div style="min-height:100vh;background:var(--side);color:var(--ink);padding:32px;display:flex;flex-direction:column;gap:24px;">
  <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;"><a href="Estimates AI Agent.dc.html" style="color:var(--ink2);text-decoration:none;font-size:13px;">‹ All pages</a><h1 style="margin:0;font-size:22px;font-weight:600;">Phone views</h1><span style="font-size:14px;color:var(--ink2);">The real pages at 390 px wide. Each frame is live: scroll, tap, open the menu.</span></div>
  <div style="display:flex;gap:28px;flex-wrap:wrap;">
    <sc-for list="{{ frames }}" as="f" hint-placeholder-count="4">
      <div style="display:flex;flex-direction:column;gap:10px;">
        <span style="font-size:13px;font-weight:500;">{{ f.label }}</span>
        <div style="width:390px;height:800px;border-radius:36px;border:10px solid #16181c;overflow:hidden;background:var(--bg);box-shadow:0 20px 50px rgba(0,0,0,0.18);">
          <iframe src="{{ f.src }}" style="width:100%;height:100%;border:0;display:block;"></iframe>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { frames: [['Chat', 'chat.dc.html?s=result'], ['Document viewer as a full-screen sheet', 'chat.dc.html?s=result&doc=estimate&sheet=EL&row=58'], ['New estimate', 'chat-new.dc.html'], ['History', 'history.dc.html']].map(f => ({ label: f[0], src: f[1] })) };
  }
}
</script>
</body>
</html>
