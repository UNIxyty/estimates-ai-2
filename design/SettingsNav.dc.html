<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav style="display:flex;flex-direction:column;gap:2px;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13.5px;">
  <div style="padding:0 10px 10px;font-size:20px;font-weight:600;letter-spacing:-0.01em;color:var(--ink);">Settings</div>
  <sc-for list="{{ items }}" as="i" hint-placeholder-count="4">
    <a href="{{ i.href }}" style="display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:8px;text-decoration:none;color:{{ i.fg }};background:{{ i.bg }};font-weight:{{ i.fw }};" style-hover="background:var(--sunk);">{{ i.label }}<sc-if value="{{ i.admin }}" hint-placeholder-val="{{ false }}"><span style="margin-left:auto;font-size:10.5px;font-weight:500;color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:0 5px;">Admin</span></sc-if></a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:220},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;usage&quot;,&quot;routing&quot;,&quot;profile&quot;,&quot;users&quot;],&quot;default&quot;:&quot;usage&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'usage';
    return { items: [['usage', 'Usage & costs'], ['routing', 'Model routing'], ['profile', 'Profile'], ['users', 'Users', 1]].map(([k, label, admin]) => ({ label, admin: !!admin, href: `settings-${k}.dc.html`, bg: a === k ? 'var(--sunk)' : 'transparent', fg: a === k ? 'var(--ink)' : 'var(--ink2)', fw: a === k ? 500 : 400 })) };
  }
}
</script>
</body>
</html>
