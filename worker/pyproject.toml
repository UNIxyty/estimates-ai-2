[project]
name = "estimates-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "pdfplumber>=0.11",
  "mammoth>=1.8",
  "boto3>=1.35",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "reportlab>=4", "pypdf>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
